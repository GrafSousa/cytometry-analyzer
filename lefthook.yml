# Git hooks. `pnpm install` installs them through the `prepare` script.
# Never bypass them with --no-verify.

pre-commit:
  parallel: true
  commands:
    block-main:
      run: scripts/hooks/block-main-commit.sh
    block-secret-files:
      run: scripts/hooks/block-secret-files.sh {staged_files}
    block-spreadsheets:
      run: scripts/hooks/block-spreadsheets.sh {staged_files}
    gitleaks:
      run: scripts/hooks/gitleaks-staged.sh
    prettier:
      run: pnpm exec prettier --check --ignore-unknown {staged_files}
    eslint:
      glob: "*.{js,jsx,mjs,ts,tsx,mts}"
      run: pnpm exec eslint --max-warnings 0 --no-warn-ignored {staged_files}
    typecheck:
      glob: "*.{ts,tsx,mts}"
      run: pnpm typecheck

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}

# The full build and the tests are too slow for every commit, so they run before each push.
pre-push:
  piped: true
  commands:
    block-main:
      priority: 1
      run: scripts/hooks/block-main-push.sh
      use_stdin: true
    test:
      priority: 2
      run: pnpm test
    build:
      priority: 3
      run: pnpm build
